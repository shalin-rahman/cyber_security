# ==============================================================================
# SEED Labs 2.0 — Clickjacking Attack Lab
# ==============================================================================

services:

  target-website:
    build: ./image_target
    image: seed-image-www-clickjacking
    container_name: cjlab-10.9.0.80
    tty: true
    restart: unless-stopped
    networks:
      net-10.9.0.0:
        ipv4_address: 10.9.0.80
    ports:
      - "10084:80"

  attacker-website:
    build: ./image_attacker
    image: seed-image-www-clickjacking-attacker
    container_name: cjlab-attacker-10.9.0.81
    tty: true
    restart: unless-stopped
    networks:
      net-10.9.0.0:
        ipv4_address: 10.9.0.81
    ports:
      - "10085:80"

networks:
  net-10.9.0.0:
    name: net-10.9.0.0-clickjacking
    ipam:
      config:
        - subnet: 10.9.0.0/24
