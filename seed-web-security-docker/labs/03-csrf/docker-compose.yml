# ==============================================================================
# SEED Labs 2.0 — Cross-Site Request Forgery (CSRF) Attack Lab
# ==============================================================================

services:

  elgg:
    build: ./image_www
    image: seed-image-www-csrf-elgg
    container_name: elgg-10.9.0.5-csrf
    tty: true
    restart: unless-stopped
    depends_on:
      - mysql
    networks:
      net-10.9.0.0:
        ipv4_address: 10.9.0.5
    ports:
      - "10082:80"
    environment:
      - MYSQL_HOST=10.9.0.6

  attacker:
    build: ./image_attacker
    image: seed-image-www-csrf-attacker
    container_name: attacker-10.9.0.105
    tty: true
    restart: unless-stopped
    networks:
      net-10.9.0.0:
        ipv4_address: 10.9.0.105
    ports:
      - "10083:80"

  mysql:
    build: ./image_mysql
    image: seed-image-mysql-csrf
    container_name: mysql-10.9.0.6-csrf
    restart: unless-stopped
    networks:
      net-10.9.0.0:
        ipv4_address: 10.9.0.6
    environment:
      - MYSQL_ROOT_PASSWORD=seedubuntu
    command: --default-authentication-plugin=mysql_native_password

networks:
  net-10.9.0.0:
    name: net-10.9.0.0-csrf
    ipam:
      config:
        - subnet: 10.9.0.0/24
