# ==============================================================================
# SEED Labs 2.0 — Shellshock Vulnerability Lab
# ==============================================================================

# Services definition for the Shellshock lab – runs the vulnerable web server container
services:

  www:
    build: ./image_www
    image: seed-image-www-shellshock
    container_name: shellshock-10.9.0.80
    tty: true
    restart: unless-stopped
    networks:
      net-10.24.0.0:
        ipv4_address: 10.24.0.80
    ports:
      - "10086:80"

# Network block – custom Docker network with its own subnet to avoid IP collisions across labs
networks:
  net-10.24.0.0:
    name: net-10.24.0.0-shellshock
    ipam:
      config:
        - subnet: 10.24.0.0/24
