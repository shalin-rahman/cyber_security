# ==============================================================================
# SEED Labs 2.0 — SQL Injection Attack Lab
#
# Official lab manual:
#   https://seedsecuritylabs.org/Labs_20.04/Web/Web_SQL_Injection/
# ==============================================================================

# Services definition for the SQL Injection lab – each service runs a container
services:

# Service: vulnerable web app (SQL Injection)
  www:
    build: ./image_www
    image: seed-image-www-sqli
    container_name: www-10.9.0.5
    tty: true
    restart: unless-stopped
    depends_on:
      - mysql
    networks:
      net-10.20.0.0-sqli:
        ipv4_address: 10.20.0.5
    ports:
      - "10080:80"
    environment:
      - MYSQL_HOST=10.20.0.6

# Service: MySQL backend for the SQL Injection lab
  mysql:
    build: ./image_mysql
    image: seed-image-mysql-sqli
    container_name: mysql-10.9.0.6
    restart: unless-stopped
    networks:
      net-10.20.0.0-sqli:
        ipv4_address: 10.20.0.6
    environment:
      - MYSQL_ROOT_PASSWORD=dees
    command: --default-authentication-plugin=mysql_native_password

# Network block – defines a custom Docker network with its own subnet to avoid IP conflicts across labs
networks:
  net-10.20.0.0-sqli:
    name: net-10.20.0.0-sqli
    ipam:
      config:
        - subnet: 10.20.0.0/24
