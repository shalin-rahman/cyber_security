# Official lab manual:
#   https://seedsecuritylabs.org/Labs_20.04/Web/Web_SQL_Injection/
# ==============================================================================

services:

  www:
    build: ./image_www
    image: seed-image-www-sqli
    container_name: www-10.9.0.5
    tty: true
    restart: unless-stopped
    depends_on:
      - mysql
    networks:
      net-10.9.0.0:
        ipv4_address: 10.9.0.5
    ports:
      - "10080:80"
    environment:
      - MYSQL_HOST=10.9.0.6

  mysql:
    build: ./image_mysql
    image: seed-image-mysql-sqli
    container_name: mysql-10.9.0.6
    restart: unless-stopped
    networks:
      net-10.9.0.0:
        ipv4_address: 10.9.0.6
    environment:
      - MYSQL_ROOT_PASSWORD=dees
    command: --default-authentication-plugin=mysql_native_password

networks:
  net-10.9.0.0:
    name: net-10.9.0.0-sqli
    ipam:
      config:
        - subnet: 10.9.0.0/24
