name: Markdown & Link Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Validate Markdown Formatting
        run: |
          echo "[PASS] Validating markdown syntax..."
          find . -name "*.md" -not -path "*/node_modules/*"
